[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules", "lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Deploy.s.sol reads and writes the shared deployments/<network>.json files at the repo root.
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[lint]
# Excluded as systematic false positives for this codebase, reviewed case by case:
#  block-timestamp: staleness, timelocks and recovery windows are timestamp rules by design (minutes to days, far
#    above validator skew).
#  unsafe-typecast: every flagged cast is uint64(block.timestamp / block.number) or a bounds-checked decode.
#  unused-return: partial tuple destructuring of statusOf / latestRoundData / creditOf, intentionally.
#  environment-read-across-mutation: tests compute expected timestamps around vm.warp on purpose.
exclude_lints = ["block-timestamp", "unsafe-typecast", "unused-return", "environment-read-across-mutation"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
eth_sepolia = "${RPC_ETH_SEPOLIA_1}"
arb_sepolia = "${RPC_ARB_SEPOLIA_1}"
base_sepolia = "${RPC_BASE_SEPOLIA_1}"
