# Logical CRE secret id -> environment variable the CLI reads during simulation (values live only in the repo
# .env or in the Vault DON after `cre secrets create`). W3 skips a channel whose secret is empty.
secretsNames:
  NOTIFY_TELEGRAM_BOT_TOKEN:
    - TELEGRAM_BOT_TOKEN
  NOTIFY_TELEGRAM_CHAT_ID:
    - TELEGRAM_CHAT_ID
  NOTIFY_SLACK_WEBHOOK_URL:
    - SLACK_WEBHOOK_URL
